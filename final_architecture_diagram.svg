  <text x="470" y="490" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Token usage • Costs • Attribution • Trends</text>
  
  <!-- Arrows from database to outputs -->
  <line x1="370" y1="510" x2="200" y2="590" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="510" x2="470" y2="590" stroke="#990011" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="570" y1="510" x2="740" y2="590" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- BOTTOM ROW: Outputs -->
  
  <!-- Dashboards -->
  <rect x="70" y="600" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="600" width="200" height="38" rx="10" fill="#2F3C7E"/>
  <text x="170" y="625" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">📈 Dashboards</text>
  
  <text x="90" y="660" font-family="Arial, sans-serif" font-size="10" fill="#334155">• Cost trends over time</text>
  <text x="90" y="680" font-family="Arial, sans-serif" font-size="10" fill="#334155">• Team breakdowns</text>
  <text x="90" y="700" font-family="Arial, sans-serif" font-size="10" fill="#334155">• Model usage</text>
  <text x="90" y="720" font-family="Arial, sans-serif" font-size="10" fill="#334155">• Agent comparison</text>
  
  <!-- AI Monitoring Agent (MAIN FOCUS) -->
  <rect x="310" y="600" width="320" height="160" rx="12" fill="#FFFFFF" stroke="#990011" stroke-width="4" filter="url(#shadow)"/>
  <rect x="310" y="600" width="320" height="45" rx="12" fill="url(#headerGrad)"/>
