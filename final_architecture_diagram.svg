  <text x="330" y="670" font-family="Arial, sans-serif" font-size="11" fill="#334155" font-style="italic">"Why did costs spike Thursday?"</text>
  <text x="330" y="695" font-family="Arial, sans-serif" font-size="11" fill="#334155" font-style="italic">"Which agent costs the most?"</text>
  <text x="330" y="720" font-family="Arial, sans-serif" font-size="11" fill="#334155" font-style="italic">"How can we reduce spend 40%?"</text>
  
  <text x="470" y="750" font-family="Arial, sans-serif" font-size="10" fill="#990011" font-weight="bold" text-anchor="middle">🤖 AI watching your AI — natural language queries</text>
  
  <!-- Alerts -->
  <rect x="670" y="600" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="670" y="600" width="200" height="38" rx="10" fill="#DC2626"/>
  <text x="770" y="625" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🚨 Budget Alerts</text>
  
  <text x="690" y="660" font-family="Arial, sans-serif" font-size="10" fill="#334155">• Threshold warnings</text>
  <text x="690" y="680" font-family="Arial, sans-serif" font-size="10" fill="#334155">• Anomaly detection</text>
  <text x="690" y="700" font-family="Arial, sans-serif" font-size="10" fill="#334155">• Auto-throttling</text>
  <text x="690" y="720" font-family="Arial, sans-serif" font-size="10" fill="#334155">• Slack notifications</text>
  
  <!-- Right side boxes -->
  
  <!-- Anti-patterns -->
  <rect x="900" y="110" width="270" height="200" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
  <rect x="900" y="110" width="270" height="40" rx="12" fill="#DC2626"/>
  <text x="1035" y="136" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">⚠️ 5 Anti-Patterns</text>
  
  <text x="920" y="172" font-family="Arial, sans-serif" font-size="10" fill="#7F1D1D">1. Context Cannon (load everything)</text>
  <text x="920" y="194" font-family="Arial, sans-serif" font-size="10" fill="#7F1D1D">2. Retry Death Spiral</text>
  <text x="920" y="216" font-family="Arial, sans-serif" font-size="10" fill="#7F1D1D">3. Model Mismatch (Opus for simple)</text>
  <text x="920" y="238" font-family="Arial, sans-serif" font-size="10" fill="#7F1D1D">4. Chatty Agent (too many calls)</text>
  <text x="920" y="260" font-family="Arial, sans-serif" font-size="10" fill="#7F1D1D">5. No Monitoring 👈 We fix this!</text>
  
  <!-- Optimization strategies -->
  <rect x="900" y="330" width="270" height="180" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <rect x="900" y="330" width="270" height="40" rx="12" fill="#059669"/>
  <text x="1035" y="356" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">💰 Optimization Strategies</text>
  
  <text x="920" y="395" font-family="Arial, sans-serif" font-size="10" fill="#047857">✓ Prompt Caching → 20-40% savings</text>
  <text x="920" y="420" font-family="Arial, sans-serif" font-size="10" fill="#047857">✓ Model Tiering → 40-70% savings</text>
  <text x="920" y="445" font-family="Arial, sans-serif" font-size="10" fill="#047857">✓ Diff-Only Analysis → 60-80% savings</text>
  <text x="920" y="470" font-family="Arial, sans-serif" font-size="10" fill="#047857">✓ Request Batching → 15-25% savings</text>
  <text x="920" y="495" font-family="Arial, sans-serif" font-size="10" fill="#065F46" font-weight="bold">Combined: 40-70% total reduction</text>
  
  <!-- Stats callouts -->
  <rect x="900" y="530" width="125" height="90" rx="10" fill="#990011" filter="url(#shadow)"/>
  <text x="962" y="570" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">$10K</text>
  <text x="962" y="595" font-family="Arial, sans-serif" font-size="10" fill="#FECACA" text-anchor="middle">The weekend</text>
  <text x="962" y="610" font-family="Arial, sans-serif" font-size="10" fill="#FECACA" text-anchor="middle">that started it all</text>
  
  <rect x="1045" y="530" width="125" height="90" rx="10" fill="#2F3C7E" filter="url(#shadow)"/>
  <text x="1107" y="570" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">40%+</text>
  <text x="1107" y="595" font-family="Arial, sans-serif" font-size="10" fill="#C7D2FE" text-anchor="middle">Savings</text>
  <text x="1107" y="610" font-family="Arial, sans-serif" font-size="10" fill="#C7D2FE" text-anchor="middle">achievable</text>
  
  <!-- Tech Stack -->
  <rect x="900" y="640" width="270" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="668" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">🛠️ Tech Stack</text>
  <text x="1035" y="692" font-family="Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">LangChain • Claude API • Python</text>
  <text x="1035" y="710" font-family="Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Slack Bot • Time-Series DB</text>
  
  <!-- Footer -->
  <rect x="0" y="780" width="1200" height="120" fill="#1A1A2E"/>
  <text x="600" y="820" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Using AI to Monitor AI: FinOps for the Agent Era</text>
  <text x="600" y="850" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">CloudX AI Conference • The meta solution to AI cost management</text>
</svg>
